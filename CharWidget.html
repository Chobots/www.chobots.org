<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="chobots-game-release" content="/game/713a9af3fc5597fea509939c0141f57b37d8ced0">
    <title>Chobots Character</title>
    <link rel="stylesheet" href="/archive-notice.css" type="text/css" media="screen"/>
    <script src="/archive-notice.js" type="text/javascript"></script>
    <script>
        Object.defineProperty(window, "chobotsGameAssetRoot", {
            value: "/game/713a9af3fc5597fea509939c0141f57b37d8ced0",
            writable: false,
            configurable: false
        });
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: "on",
            allowScriptAccess: true,
            unmuteOverlay: "hidden",
            preloader: false,
            splashScreen: false,
            contextMenu: false,
            wmode: "transparent"
        };
    </script>
    <script src="/game/713a9af3fc5597fea509939c0141f57b37d8ced0/javascripts/chobots-play-mode.js" type="text/javascript"></script>
    <script src="/game/713a9af3fc5597fea509939c0141f57b37d8ced0/javascripts/ruffle-ws-bridge.js" type="text/javascript"></script>
    <script src="/game/713a9af3fc5597fea509939c0141f57b37d8ced0/ruffle/ruffle.js" type="text/javascript"></script>
    <style>
        html, body { margin: 0; padding: 0; background: #fff; }
        #flashContent { width: 235px; height: 308px; }
    </style>
</head>
<body>
<div id="flashContent"></div>
<script>
(function () {
    var params = new URLSearchParams(window.location.search);
    var mode = window.chobotsPlayMode;
    var defaultUrl = "wss://default-server.chobots.org/ws/game";
    var wsUrl = params.get("wsUrl");
    if (!wsUrl) {
        if (!params.has("join")) wsUrl = defaultUrl;
        else if (mode.kind === "native") wsUrl = mode.wsUrl;
        else if (mode.kind === "guest") wsUrl = mode.relayUrl;
        else wsUrl = defaultUrl;
    }
    window.chobotsCharWidgetFlashvars = {
        transport: "websocket",
        wsUrl: wsUrl,
        login: params.get("login") || "go!",
        locale: params.get("locale") || "enUS"
    };
    window.chobotsGetCharWidgetFlashvar = function (name) {
        return window.chobotsCharWidgetFlashvars[name] || null;
    };
    var ruffle = window.RufflePlayer.newest();
    var player = ruffle.createPlayer();
    player.style.width = "235px";
    player.style.height = "308px";
    document.getElementById("flashContent").appendChild(player);
    player.load({
        url: window.chobotsGameAssetRoot + "/CharWidget.swf",
        allowScriptAccess: true,
        parameters: window.chobotsCharWidgetFlashvars
    });
})();
</script>
</body>
</html>
