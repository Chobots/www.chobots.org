<!DOCTYPE html>
<html lang="en">
<head>
    <title>KavalokAdmin</title>
    <meta name="chobots-game-release" content="/game/9fd30a871c556bfc43154518a23d17ea8174a612">
    <link rel="stylesheet" href="/archive-notice.css" type="text/css" media="screen"/>
    <script src="/archive-notice.js" type="text/javascript"></script>
    <link rel="stylesheet" href="/game/9fd30a871c556bfc43154518a23d17ea8174a612/stylesheets/private-world.css" type="text/css"/>
    <script>
        Object.defineProperty(window, "chobotsGameAssetRoot", {
            value: "/game/9fd30a871c556bfc43154518a23d17ea8174a612",
            writable: false,
            configurable: false
        });
        window.chobotsGetAdminFlashvar = function (name) {
            var flashvars = window.chobotsAdminFlashvars || {};
            return flashvars[name] || null;
        };
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = { autoplay: "on", allowScriptAccess: true, warnOnUnsupportedContent: true, preloader: false, splashScreen: false, contextMenu: false, wmode: "transparent" };
    </script>
    <script src="/game/9fd30a871c556bfc43154518a23d17ea8174a612/javascripts/chobots-play-mode.js"></script>
    <script src="/game/9fd30a871c556bfc43154518a23d17ea8174a612/javascripts/chobots-play-choice.js"></script>
    <script src="/game/9fd30a871c556bfc43154518a23d17ea8174a612/javascripts/chobots-relay-config.js"></script>
    <script src="/game/9fd30a871c556bfc43154518a23d17ea8174a612/javascripts/ruffle-ws-bridge.js"></script>
    <script src="/game/9fd30a871c556bfc43154518a23d17ea8174a612/javascripts/chobots-admin-page.js"></script>
    <script src="/game/9fd30a871c556bfc43154518a23d17ea8174a612/ruffle/ruffle.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            border: 0;
            overflow: hidden;
            background: #6d838e linear-gradient(#94aab5, #6d838e);
        }

        #flashContent {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #chobotsPlayChooser {
            position: fixed;
            inset: 0;
            max-width: none;
            margin: 0;
            border: 0;
            border-radius: 0;
            padding: 24px;
            overflow: hidden;
            color: #253b46;
            background: #6d838e linear-gradient(#94aab5, #6d838e);
            font: 11px Tahoma, Arial, sans-serif;
        }

        #chobotsJoinForm {
            display: grid;
            grid-template-columns: 130px 180px;
            gap: 7px 10px;
            width: min(320px, calc(100vw - 48px));
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: none;
            box-shadow: none;
        }

        #chobotsJoinForm label {
            grid-column: 1;
            align-self: center;
            color: #253b46;
            font-weight: normal;
            text-align: right;
        }

        #chobotsJoinCode {
            grid-column: 2;
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
            height: 25px;
            padding: 3px 5px;
            border: 1px solid #879aa3;
            border-radius: 0;
            color: #222;
            background: #fff;
            box-shadow: none;
            font: inherit;
        }

        #chobotsJoinFriend {
            grid-column: 2;
            justify-self: start;
            width: 72px;
            height: 25px;
            padding: 0 8px;
            border: 1px solid #84969e;
            border-radius: 4px;
            color: #31464f;
            background: linear-gradient(#d7e0e3, #9eafb6);
            box-shadow: 0 1px 0 rgba(255, 255, 255, .45) inset;
            font: 11px Tahoma, Arial, sans-serif;
            cursor: pointer;
        }

        #chobotsJoinFriend:hover { background: linear-gradient(#e3eaec, #adbbc1); }
        #chobotsJoinFriend:active { background: linear-gradient(#91a4ac, #c3cdd1); }

        #chobotsJoinCode:focus-visible,
        #chobotsJoinFriend:focus-visible {
            outline: 3px solid rgba(255, 255, 255, .9);
            outline-offset: 2px;
        }

        #chobotsJoinError {
            grid-column: 2;
            margin: 4px 0 0;
            color: #7a1010;
            font-weight: bold;
        }

        @media (max-width: 520px) {
            #chobotsJoinForm { grid-template-columns: 1fr; }
            #chobotsJoinForm label,
            #chobotsJoinCode,
            #chobotsJoinFriend,
            #chobotsJoinError { grid-column: 1; }
            #chobotsJoinForm label { text-align: left; }
            #chobotsJoinFriend { width: 100%; }
        }
    </style>
</head>
<body>
<div id="flashContent"></div>
<section id="chobotsPlayChooser" class="private-world-section" hidden>
    <form id="chobotsJoinForm">
        <label for="chobotsJoinCode">Sharing code or link</label>
        <input id="chobotsJoinCode" type="text" maxlength="2048" autocomplete="off"/>
        <button id="chobotsJoinFriend" type="submit">Connect</button>
        <p id="chobotsJoinError" role="alert" hidden></p>
    </form>
</section>
</body>
</html>
