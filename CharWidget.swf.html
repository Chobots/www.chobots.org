<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="chobots-game-release" content="/game/3a074d88164ef168d05a457230ed1da8a6a9c909">
    <title>Chobots Character</title>
    <script>
        window.chobotsGameAssetRoot = "/game/3a074d88164ef168d05a457230ed1da8a6a9c909";
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: "on",
            allowScriptAccess: true,
            unmuteOverlay: "hidden",
            splashScreen: false,
            contextMenu: "off",
            wmode: "transparent"
        };
    </script>
    <style>
        html, body, #flashContent, #flashContent ruffle-player {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        html, body {
            background: #fff;
        }
        #flashContent, #flashContent ruffle-player {
            display: block;
        }
        #charWidgetError {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: none;
            box-sizing: border-box;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            background: #fff;
            color: #333;
            font: 14px/1.4 Tahoma, Arial, sans-serif;
            text-align: center;
        }
        #charWidgetHome {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: block;
            visibility: hidden;
            cursor: pointer;
            pointer-events: none;
        }
        #charWidgetHome[data-active="true"] {
            visibility: visible;
            pointer-events: auto;
        }
    </style>
</head>
<body>
<div id="flashContent"></div>
<div id="charWidgetError" role="alert"></div>
<a id="charWidgetHome" href="https://www.chobots.org" target="_blank" rel="noopener" aria-label="Visit Chobots.org"></a>
<script src="/game/3a074d88164ef168d05a457230ed1da8a6a9c909/javascripts/chobots-play-mode.js" type="text/javascript"></script>
<script src="/game/3a074d88164ef168d05a457230ed1da8a6a9c909/javascripts/ruffle-ws-bridge.js" type="text/javascript"></script>
<script src="/game/3a074d88164ef168d05a457230ed1da8a6a9c909/javascripts/chobots-legacy-rpc.js" type="text/javascript"></script>
<script src="/game/3a074d88164ef168d05a457230ed1da8a6a9c909/javascripts/chobots-char-widget.js" type="text/javascript"></script>
<script src="/game/3a074d88164ef168d05a457230ed1da8a6a9c909/ruffle/ruffle.js" type="text/javascript"></script>
<script>
(function () {
    var controller = window.chobotsCharWidget.createController({
        window: window,
        fetch: window.fetch.bind(window),
        playMode: window.chobotsPlayMode
    });
    window.chobotsCharWidgetController = controller;
    window.chobotsCharWidgetReady = function () { controller.flashReady(); };
    window.chobotsCharWidgetRendered = function () { controller.rendered(); };
    window.chobotsCharWidgetRenderError = function (code) { controller.fail({ code: String(code || "character_render_failed") }); };

    window.addEventListener("chobots-char-widget-error", function (event) {
        var error = document.getElementById("charWidgetError");
        error.textContent = event.detail && event.detail.code === "character_not_found"
            ? "Character not found."
            : "Unable to load this character.";
        error.style.display = "flex";
    });
    window.addEventListener("chobots-char-widget-rendered", function () {
        document.getElementById("charWidgetHome").setAttribute("data-active", "true");
    });
    controller.start();

    if (controller.request.bridgeOnly)
        return;
    var ruffle = window.RufflePlayer.newest();
    var player = ruffle.createPlayer();
    document.getElementById("flashContent").appendChild(player);
    controller.setPlayer(player);
    player.load({
        url: window.chobotsGameAssetRoot + "/CharWidget.swf",
        allowScriptAccess: true
    });
})();
</script>
</body>
</html>
