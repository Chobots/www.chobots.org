<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="chobots-game-release" content="/game/f41a9886e6a56f64ee9af2db110104334453ae82">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Chobots Character</title>
    <script>window.chobotsGameAssetRoot = "/game/f41a9886e6a56f64ee9af2db110104334453ae82";</script>
    <style>
        html, body, #svgWidget, #svgWidgetImage { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }
        html, body { background:#fff; }
        #svgWidget { position:relative; }
        #svgWidgetImage { display:block; object-fit:contain; }
        #svgWidgetState { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; color:#333; font:14px/1.4 Tahoma,Arial,sans-serif; text-align:center; }
        #svgWidgetHome { position:absolute; inset:0; visibility:hidden; pointer-events:none; }
        #svgWidgetHome[data-active="true"] { visibility:visible; pointer-events:auto; cursor:pointer; }
    </style>
</head>
<body>
<div id="svgWidget">
    <img id="svgWidgetImage" width="235" height="308" alt="">
    <div id="svgWidgetState" role="status">Loading character…</div>
    <a id="svgWidgetHome" href="https://www.chobots.org" target="_blank" rel="noopener" aria-label="Visit Chobots.org"></a>
</div>
<script src="/game/f41a9886e6a56f64ee9af2db110104334453ae82/javascripts/chobots-play-mode.js"></script>
<script src="/game/f41a9886e6a56f64ee9af2db110104334453ae82/javascripts/chobots-websocket-transport.js"></script>
<script src="/game/f41a9886e6a56f64ee9af2db110104334453ae82/javascripts/chobots-legacy-rpc.js"></script>
<script src="/game/f41a9886e6a56f64ee9af2db110104334453ae82/javascripts/chobots-svg-widget.js"></script>
<script>
(function () {
    var image = document.getElementById("svgWidgetImage");
    var state = document.getElementById("svgWidgetState");
    var controller = window.chobotsSvgWidget.createController({
        root: window,
        image: image,
        state: state,
        transport: window.chobotsWebSocketTransport.create(window),
        rpc: window.chobotsLegacyRpc
    });
    window.chobotsSvgWidgetController = controller;
    window.addEventListener("chobots-svg-widget-rendered", function () {
        state.style.display = "none";
        document.getElementById("svgWidgetHome").setAttribute("data-active", "true");
    });
    window.addEventListener("chobots-svg-widget-error", function (event) {
        var code = event.detail && event.detail.code;
        state.textContent = code === "character_not_found" ? "Character not found."
            : code === "unsupported_world" ? "This world does not support character previews."
            : "Unable to load this character.";
    });
    controller.start().catch(function () {});
})();
</script>
</body>
</html>
